  <div style="display: flex; justify-content: space-between; align-items: center; padding: 4px 20px 0">

        <button type="button" style="border: none; padding: 11px 20px; border-radius: 999px; background: #FF9A85; color: #2A0E06; font-family: inherit; font-size: 16px; font-weight: 700">Play again</button>

      <div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); grid-auto-rows: 42px">
        <sc-for list="{{days}}" as="d" hint-placeholder-count="35">
          <div style="position: relative; display: flex; align-items: center; justify-content: center">
            <div style="position: absolute; top: 3px; bottom: 3px; left: {{d.bl}}; right: {{d.br}}; background: {{d.band}}"></div>
            <span style="position: relative; width: 36px; height: 36px; box-sizing: border-box; border-radius: 18px; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: {{d.w}}; font-variant-numeric: tabular-nums; color: {{d.color}}; background: {{d.bg}}; box-shadow: {{d.ring}}">{{d.n}}</span>
            <span style="position: absolute; left: 50%; bottom: 5px; width: 5px; height: 5px; margin-left: -2.5px; border-radius: 3px; background: {{d.dot}}"></span>

        </sc-for>
      </div>

      <span style="text-align: center; font-size: 13px; color: #8A9DA0; padding: 0 12px 2px">Past days are practice: they don't count toward your streak.</span>

  <span style="position: absolute; left: 50%; bottom: 8px; width: 134px; height: 5px; margin-left: -67px; border-radius: 3px; background: #E8F1F2; opacity: 0.7"></span>

</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    // Completed on their day (filled, joined by a band), past days cleared as practice
    // (soft tint) and a practice left halfway (dot).
    const done = [21, 22, 23, 24, 25, 26, 27, 28];
    const practiced = [12, 15];
    const inProgress = [17];
    const today = 28;
    const offset = 4;
    const days = [];
    for (let k = 0; k < offset; k++) days.push({ n: '', bl: '50%', br: '50%', band: 'transparent', bg: 'transparent', color: 'transparent', ring: 'none', w: 500, dot: 'transparent' });
    for (let n = 1; n <= 31; n++) {
      const col = (n - 1 + offset) % 7;
      const isDone = done.includes(n);
      const left = isDone && col !== 0 && done.includes(n - 1);
      const right = isDone && col !== 6 && done.includes(n + 1);
      const d = { n, bl: left ? '0' : '50%', br: right ? '0' : '50%', band: left || right ? 'rgba(91, 194, 207, 0.2)' : 'transparent', ring: 'none', dot: inProgress.includes(n) ? '#FF9A85' : 'transparent' };
      if (isDone) Object.assign(d, { bg: '#5BC2CF', color: '#062327', w: 700 });
      else if (practiced.includes(n)) Object.assign(d, { bg: 'rgba(91, 194, 207, 0.22)', color: '#5BC2CF', w: 700 });
      else if (n < today) Object.assign(d, { bg: 'transparent', color: '#E8F1F2', w: 500 });
      else Object.assign(d, { bg: 'transparent', color: '#4A5B5E', w: 500 });
      if (n === today) d.ring = '0 0 0 2px #0F1A1D, 0 0 0 4px #FF9A85';
      days.push(d);
    }
    return { days };
  }
}
</script>
</body>
