<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const rows = [[9, 7, 1, 7, 1, 9, 3, 5, 8], [2, 1, 9, 7, 4, 8, 8, 3, 8], [2, 8, 9, 4, 6, 5, 1, 5, 4], [5, 5, 8, 9, 1, 3, 7, 1, 1], [7, 1, 9, 3, 5, 4, 8, 8, 3], [8, 9, 4, 6, 5, 1, 5, 4, 5], [5, 8, 3, 7, 7, 1, 9, 3, 5], [4, 8, 8, 3, 8, 9, 5, 1, 5], [4, 8, 3, 7, 7, 9, 3, 4, 8], [8, 3, 4, 6, 1, 5, 4, 3, 7]];
    const ghosts = [0, 2, 3, 8, 9, 10, 11, 12, 18, 19, 21, 22, 27, 28, 30, 31, 34, 35, 37, 40, 45, 46, 47, 48, 49, 53, 54, 55, 64, 73];
    const sel = [1];
    const cells = rows.flat().map((n, i) => {
      if (sel.includes(i)) return { n, color: '#5BC2CF', bg: 'rgba(91, 194, 207, 0.14)', ring: '0 0 0 2px #5BC2CF' };
      if (ghosts.includes(i)) return { n, color: '#2C3A3D', bg: 'transparent', ring: 'none' };
      return { n, color: i >= 36 ? '#FF9A85' : '#E8F1F2', bg: 'transparent', ring: 'none' };
    });
    return { cells };
  }
}
