<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>App Store 04 · No ads, no purchases</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800;900&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#B9472F}a:hover{color:#8F3522}
</style>
</helmet>
<div style="width: 440px; height: 956px; position: relative; overflow: hidden; background: #FCE9E3; color: #16201F; font-family: ui-rounded, 'SF Pro Rounded', Nunito, system-ui, sans-serif">
  <div style="position: absolute; left: 0; right: 0; top: 0; padding: 60px 36px 0; display: flex; flex-direction: column; gap: 16px">
    <h1 style="margin: 0; font-size: 52px; line-height: 1.02; font-weight: 900; letter-spacing: -0.015em">No ads.<br><span style="color: #B9472F">No purchases.</span></h1>
    <p style="margin: 0; font-size: 20px; line-height: 1.35; font-weight: 600; color: #4A5B5E">Always free, no hidden charges. Just focus on playing.</p>
  </div>

  <div style="position: absolute; left: 50px; top: 320px; width: 340px; height: 736px; box-sizing: border-box; padding: 8px; border-radius: 52px; background: #000000; box-shadow: 0 30px 70px rgba(120, 50, 30, 0.3)">
    <div style="width: 324px; height: 720px; border-radius: 44px; overflow: hidden; background: #0B1517; color: #E8F1F2; font-family: -apple-system, 'SF Pro Text', system-ui, sans-serif; box-sizing: border-box; padding: 0 18px 0; display: flex; flex-direction: column">
      <div style="position: relative; height: 40px; flex-shrink: 0; margin: 0 -4px; display: flex; justify-content: space-between; align-items: center; padding: 0 20px 0 26px; font-family: -apple-system, 'SF Pro Text', system-ui, sans-serif; font-size: 14px; font-weight: 600; color: #E8F1F2">
        <span style="font-variant-numeric: tabular-nums">9:41</span>
        <span style="position: absolute; left: 50%; top: 9px; width: 96px; height: 28px; margin-left: -48px; border-radius: 14px; background: #000000"></span>
        <span style="display: flex; align-items: center; gap: 5px">
          <svg width="16" height="11" viewBox="0 0 17 11" aria-hidden="true"><rect x="0" y="7" width="3" height="4" rx="1" fill="#E8F1F2"></rect><rect x="4.5" y="5" width="3" height="6" rx="1" fill="#E8F1F2"></rect><rect x="9" y="2.5" width="3" height="8.5" rx="1" fill="#E8F1F2"></rect><rect x="13.5" y="0" width="3" height="11" rx="1" fill="#E8F1F2"></rect></svg>
          <svg width="15" height="11" viewBox="0 0 15 11" aria-hidden="true"><path d="M7.5 2.2c2.2 0 4.2.8 5.7 2.2l1.1-1.1A9.6 9.6 0 0 0 7.5.6 9.6 9.6 0 0 0 .7 3.3l1.1 1.1a8 8 0 0 1 5.7-2.2zm0 3.2c1.3 0 2.5.5 3.4 1.3l1.1-1.1a6.4 6.4 0 0 0-9 0l1.1 1.1c.9-.8 2.1-1.3 3.4-1.3zm0 3.2c.5 0 .9.2 1.2.5L7.5 10.3 6.3 9.1c.3-.3.7-.5 1.2-.5z" fill="#E8F1F2"></path></svg>
          <svg width="25" height="12" viewBox="0 0 25 12" aria-hidden="true"><rect x="0.5" y="0.5" width="21" height="11" rx="3.5" fill="none" stroke="#E8F1F2" stroke-opacity="0.4"></rect><rect x="2" y="2" width="16" height="8" rx="2" fill="#E8F1F2"></rect><path d="M23 4v4c.8-.3 1.3-1.1 1.3-2s-.5-1.7-1.3-2z" fill="#E8F1F2" fill-opacity="0.4"></path></svg>
        </span>
      </div>
      <div style="display: flex; justify-content: space-between; align-items: center">
        <button type="button" aria-label="Back" style="width: 40px; height: 40px; border: none; border-radius: 20px; background: #1A2A2E; display: flex; align-items: center; justify-content: center; padding: 0">
          <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="#E8F1F2" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"></path></svg>
        </button>
        <button type="button" aria-label="More" style="width: 40px; height: 40px; border: none; border-radius: 20px; background: #1A2A2E; display: flex; align-items: center; justify-content: center; padding: 0">
          <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10" fill="none" stroke="#5BC2CF" stroke-width="2"></circle><circle cx="7.5" cy="12" r="1.4" fill="#5BC2CF"></circle><circle cx="12" cy="12" r="1.4" fill="#5BC2CF"></circle><circle cx="16.5" cy="12" r="1.4" fill="#5BC2CF"></circle></svg>
        </button>
      </div>
      <div style="margin-top: 10px; display: flex; flex-direction: column; gap: 4px">
        <span style="font-size: 38px; line-height: 1; font-weight: 700; font-variant-numeric: tabular-nums">9,615</span>
        <span style="font-size: 15px; font-weight: 500; color: #8A9DA0">Stage 5 · Best 12,840</span>
      </div>
      <div style="margin-top: 16px; position: relative; width: 288px; height: 440px">
        <svg width="288" height="440" viewBox="0 0 288 440" aria-hidden="true" style="position: absolute; left: 0; top: 0">
          <line x1="112" y1="340" x2="144" y2="340" stroke="#5BC2CF" stroke-width="32" stroke-linecap="round"></line>
        </svg>
        <div style="position: relative; display: grid; grid-template-columns: repeat(9, minmax(0, 1fr)); grid-auto-rows: 40px">
          <sc-for list="{{cells}}" as="c" hint-placeholder-count="94">
            <div style="display: flex; align-items: center; justify-content: center">
              <span style="width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: {{c.w}}; font-variant-numeric: tabular-nums; color: {{c.color}}">{{c.n}}</span>
            </div>
          </sc-for>
        </div>
      </div>
    </div>
  </div>

  <div style="position: absolute; right: 16px; top: 412px; display: flex; flex-direction: column; align-items: flex-end; gap: 2px; padding: 10px 18px; border-radius: 22px; background: #FFFFFF; color: #16201F; box-shadow: 0 12px 28px rgba(120, 50, 30, 0.25)">
    <span style="font-size: 13px; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase; color: #4A5B5E">Best</span>
    <span style="font-size: 28px; font-weight: 900; font-variant-numeric: tabular-nums; color: #0E6B78">12,840</span>
  </div>

  <div style="position: absolute; right: 14px; top: 588px; display: flex; flex-direction: column; align-items: center; padding: 12px 22px; border-radius: 26px; background: #B9472F; color: #FFFFFF; box-shadow: 0 14px 32px rgba(90, 25, 10, 0.4)">
    <span style="font-size: 30px; line-height: 1; font-weight: 900">10 in a row!</span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":440,"height":956}}'>
class Component extends DCLogic {
  renderVals() {
    // Shared board: 4 original rows, then two rounds of + (coral). Every cleared pair was a legal move.
    const rows = [
      [9,  7,  1,  7,  1,  9,  3,  5,  8],
      [2,  1,  9,  7,  4,  8,  8,  3,  8],
      [2,  8,  9,  4,  6,  5,  1,  5,  4],
      [5,  5,  8,  9,  1,  3,  7,  1,  1],
      [7,  1,  9,  3,  5,  4,  8,  8,  3],
      [8,  9,  4,  6,  5,  1,  5,  4,  5],
      [5,  8,  3,  7,  7,  1,  9,  3,  5],
      [4,  8,  8,  3,  8,  9,  5,  1,  5],
      [4,  8,  3,  7,  7,  9,  3,  4,  8],
      [8,  3,  4,  6,  1,  5,  4,  3,  7],
    ];
    const ghosts = [0,  2,  3,  8,  9,  10,  11,  12,  18,  19,  21,  22,  27,  28,  30,  31,  34,  35,  37,  40,  45,  46,  47,  48,  49,  53,  54,  55,  64,  73];
    const addedFrom = 36;
    const sel = [75, 76];
    const cells = rows.flat().map((n, i) => {
      if (sel.includes(i)) return { n, color: '#062327', w: 800 };
      if (ghosts.includes(i)) return { n, color: '#2C3A3D', w: 400 };
      return { n, color: i >= addedFrom ? '#FF9A85' : '#E8F1F2', w: 400 };
    });
    return { cells };
  }
}
</script>
</body>
</html>
