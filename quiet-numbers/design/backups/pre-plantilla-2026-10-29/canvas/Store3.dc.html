<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>App Store 03 · Beat your friends</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800;900&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0E6B78}a:hover{color:#0A525C}
</style>
</helmet>
<div style="width: 440px; height: 956px; position: relative; overflow: hidden; background: #DCEEF0; color: #16201F; font-family: ui-rounded, 'SF Pro Rounded', Nunito, system-ui, sans-serif">
  <div style="position: absolute; left: 0; right: 0; top: 0; padding: 56px 36px 0; display: flex; flex-direction: column; gap: 14px">
    <h1 style="margin: 0; font-size: 46px; line-height: 1.02; font-weight: 900; letter-spacing: -0.015em">Beat your friends.<br><span style="color: #0E6B78">Or just yesterday's you.</span></h1>
    <p style="margin: 0; font-size: 20px; line-height: 1.35; font-weight: 600; color: #2E4A4E">A new score goal every day. Keep your streak alive.</p>
  </div>

  <div style="position: absolute; left: 50px; top: 360px; width: 340px; height: 736px; box-sizing: border-box; padding: 8px; border-radius: 52px; background: #0A1416; box-shadow: 0 30px 70px rgba(14, 107, 120, 0.3)">
    <div style="width: 324px; height: 720px; border-radius: 44px; overflow: hidden; background: #F3F7F8; color: #16201F; font-family: -apple-system, 'SF Pro Text', system-ui, sans-serif; box-sizing: border-box; padding: 0 14px 0; display: flex; flex-direction: column; gap: 10px">
      <div style="position: relative; height: 40px; flex-shrink: 0; margin: 0 -4px; display: flex; justify-content: space-between; align-items: center; padding: 0 20px 0 26px; font-family: -apple-system, 'SF Pro Text', system-ui, sans-serif; font-size: 14px; font-weight: 600; color: #16201F">
        <span style="font-variant-numeric: tabular-nums">9:41</span>
        <span style="position: absolute; left: 50%; top: 9px; width: 96px; height: 28px; margin-left: -48px; border-radius: 14px; background: #000000"></span>
        <span style="display: flex; align-items: center; gap: 5px">
          <svg width="16" height="11" viewBox="0 0 17 11" aria-hidden="true"><rect x="0" y="7" width="3" height="4" rx="1" fill="#16201F"></rect><rect x="4.5" y="5" width="3" height="6" rx="1" fill="#16201F"></rect><rect x="9" y="2.5" width="3" height="8.5" rx="1" fill="#16201F"></rect><rect x="13.5" y="0" width="3" height="11" rx="1" fill="#16201F"></rect></svg>
          <svg width="15" height="11" viewBox="0 0 15 11" aria-hidden="true"><path d="M7.5 2.2c2.2 0 4.2.8 5.7 2.2l1.1-1.1A9.6 9.6 0 0 0 7.5.6 9.6 9.6 0 0 0 .7 3.3l1.1 1.1a8 8 0 0 1 5.7-2.2zm0 3.2c1.3 0 2.5.5 3.4 1.3l1.1-1.1a6.4 6.4 0 0 0-9 0l1.1 1.1c.9-.8 2.1-1.3 3.4-1.3zm0 3.2c.5 0 .9.2 1.2.5L7.5 10.3 6.3 9.1c.3-.3.7-.5 1.2-.5z" fill="#16201F"></path></svg>
          <svg width="25" height="12" viewBox="0 0 25 12" aria-hidden="true"><rect x="0.5" y="0.5" width="21" height="11" rx="3.5" fill="none" stroke="#16201F" stroke-opacity="0.4"></rect><rect x="2" y="2" width="16" height="8" rx="2" fill="#16201F"></rect><path d="M23 4v4c.8-.3 1.3-1.1 1.3-2s-.5-1.7-1.3-2z" fill="#16201F" fill-opacity="0.4"></path></svg>
        </span>
      </div>
      <div style="display: flex; justify-content: space-between; align-items: center">
        <button type="button" aria-label="Back" style="width: 40px; height: 40px; border: none; border-radius: 20px; background: #FFFFFF; box-shadow: 0 2px 8px rgba(14, 107, 120, 0.12); display: flex; align-items: center; justify-content: center; padding: 0">
          <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="#16201F" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"></path></svg>
        </button>
        <span style="font-size: 17px; font-weight: 700">Daily Challenge</span>
        <span style="width: 40px; height: 40px"></span>
      </div>

      <div style="padding: 16px; border-radius: 24px; background: #0E6B78; color: #FFFFFF; display: flex; flex-direction: column; gap: 14px">
        <div style="display: flex; justify-content: space-between; align-items: center; gap: 10px">
          <div style="display: flex; flex-direction: column; gap: 2px">
            <span style="font-size: 13px; font-weight: 600; color: rgba(255, 255, 255, 0.85)">Saturday, Nov 14</span>
            <span style="font-size: 21px; font-weight: 800">Goal: 550 points</span>
          </div>
          <button type="button" style="border: none; padding: 10px 22px; border-radius: 999px; background: #B9472F; color: #FFFFFF; font-size: 16px; font-weight: 800; font-family: inherit">Play</button>
        </div>
        <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
          <div style="padding: 8px 10px; border-radius: 14px; background: rgba(255, 255, 255, 0.12); display: flex; flex-direction: column; gap: 2px">
            <span style="display: flex; align-items: center; gap: 4px; font-size: 22px; font-weight: 800">
              <svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2c1 4 5 6 5 11a5 5 0 0 1-10 0c0-2 1-3.5 2-4.5 0 2 1 3 2 3 0-3-1-6 1-9.5z" fill="#FFC2B5"></path></svg>
              8
            </span>
            <span style="font-size: 12px; color: rgba(255, 255, 255, 0.85)">Streak</span>
          </div>
          <div style="padding: 8px 10px; border-radius: 14px; background: rgba(255, 255, 255, 0.12); display: flex; flex-direction: column; gap: 2px">
            <span style="font-size: 22px; font-weight: 800">9</span>
            <span style="font-size: 12px; color: rgba(255, 255, 255, 0.85)">Best streak</span>
          </div>
          <div style="padding: 8px 10px; border-radius: 14px; background: rgba(255, 255, 255, 0.12); display: flex; flex-direction: column; gap: 2px">
            <span style="font-size: 22px; font-weight: 800">#3</span>
            <span style="font-size: 12px; color: rgba(255, 255, 255, 0.85)">Friends</span>
          </div>
        </div>
      </div>

      <div style="padding: 12px 10px 8px; border-radius: 24px; background: #FFFFFF; display: flex; flex-direction: column; gap: 6px">
        <div style="display: flex; justify-content: space-between; align-items: center; padding: 0 6px">
          <svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="#0E6B78" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"></path></svg>
          <span style="font-size: 16px; font-weight: 700">November 2026</span>
          <svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7" fill="none" stroke="#9AA9AB" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"></path></svg>
        </div>
        <div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); font-size: 12px; font-weight: 600; color: #5E6F72; text-align: center">
          <span>S</span><span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span>
        </div>
        <div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); grid-auto-rows: 36px">
          <sc-for list="{{days}}" as="d" hint-placeholder-count="30">
            <div style="position: relative; display: flex; align-items: center; justify-content: center">
              <div style="position: absolute; top: 3px; bottom: 3px; left: {{d.bl}}; right: {{d.br}}; background: {{d.band}}"></div>
              <span style="position: relative; width: 32px; height: 32px; box-sizing: border-box; border-radius: 16px; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: {{d.w}}; font-variant-numeric: tabular-nums; color: {{d.color}}; background: {{d.bg}}; border: {{d.border}}">{{d.n}}</span>
            </div>
          </sc-for>
        </div>
      </div>

      <div style="display: flex; flex-direction: column; gap: 8px; padding: 0 4px">
        <span style="font-size: 13px; font-weight: 700; color: #5E6F72">Friends today</span>
        <div style="display: flex; gap: 8px">
          <span style="display: flex; align-items: center; gap: 6px; padding: 5px 10px 5px 5px; border-radius: 999px; background: #FFFFFF; font-size: 14px; font-weight: 600"><span style="width: 24px; height: 24px; border-radius: 12px; background: #B9472F; color: #FFFFFF; font-size: 12px; font-weight: 800; display: flex; align-items: center; justify-content: center">J</span>Juli 412</span>
          <span style="display: flex; align-items: center; gap: 6px; padding: 5px 10px 5px 5px; border-radius: 999px; background: #FFFFFF; font-size: 14px; font-weight: 600"><span style="width: 24px; height: 24px; border-radius: 12px; background: #0E6B78; color: #FFFFFF; font-size: 12px; font-weight: 800; display: flex; align-items: center; justify-content: center">T</span>tatita12 398</span>
          <span style="display: flex; align-items: center; gap: 6px; padding: 5px 10px 5px 5px; border-radius: 999px; background: #FFFFFF; font-size: 14px; font-weight: 600"><span style="width: 24px; height: 24px; border-radius: 12px; background: #4A5B5E; color: #FFFFFF; font-size: 12px; font-weight: 800; display: flex; align-items: center; justify-content: center">V</span>Vale 377</span>
        </div>
      </div>
    </div>
  </div>

  <div style="position: absolute; right: 18px; top: 344px; display: flex; align-items: center; gap: 8px; padding: 10px 18px; border-radius: 999px; background: #B9472F; color: #FFFFFF; font-size: 20px; font-weight: 900; box-shadow: 0 12px 28px rgba(120, 40, 20, 0.3)">
    <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2c1 4 5 6 5 11a5 5 0 0 1-10 0c0-2 1-3.5 2-4.5 0 2 1 3 2 3 0-3-1-6 1-9.5z" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linejoin="round"></path></svg>
    8-day streak
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":440,"height":956}}'>
class Component extends DCLogic {
  renderVals() {
    const done = [2, 3, 6, 7, 8, 9, 10, 11, 12, 13];
    const today = 14;
    const inStreak = (n) => done.includes(n) || n === today;
    const days = [];
    for (let n = 1; n <= 30; n++) {
      const col = (n - 1) % 7;
      const left = inStreak(n) && col !== 0 && inStreak(n - 1);
      const right = inStreak(n) && col !== 6 && inStreak(n + 1);
      const d = { n, bl: left ? '0' : '50%', br: right ? '0' : '50%', band: left || right ? '#CFE7EA' : 'transparent' };
      if (done.includes(n)) Object.assign(d, { bg: '#0E6B78', color: '#FFFFFF', border: 'none', w: 700 });
      else if (n === today) Object.assign(d, { bg: '#FFFFFF', color: '#B9472F', border: '2px dashed #B9472F', w: 800 });
      else if (n < today) Object.assign(d, { bg: 'transparent', color: '#16201F', border: 'none', w: 500 });
      else Object.assign(d, { bg: 'transparent', color: '#9AA9AB', border: 'none', w: 500 });
      days.push(d);
    }
    return { days };
  }
}
</script>
</body>
</html>
