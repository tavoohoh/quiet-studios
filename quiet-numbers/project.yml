name: QuietNumbers
options:
  bundleIdPrefix: com.quietproject
  developmentLanguage: en
  deploymentTarget:
    iOS: "18.0"
    macOS: "15.0"
packages:
  QuietNumbersCore:
    path: Packages/QuietNumbersCore
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  QuietNumbers:
    type: application
    supportedDestinations: [iOS, macOS]
    sources: [App]
    dependencies:
      - package: QuietNumbersCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.quietproject.numbers
        PRODUCT_NAME: Quiet Numbers
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Quiet Numbers
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.puzzle-games
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
        "ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES[sdk=iphone*]": AppIcon-Gold
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: NO
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
        SWIFT_EMIT_LOC_STRINGS: YES
        ENABLE_APP_SANDBOX: YES
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Automatic
  QuietNumbersTests:
    type: bundle.unit-test
    supportedDestinations: [iOS]
    sources: [AppTests]
    dependencies:
      - target: QuietNumbers
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.quietproject.numbers.tests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Quiet Numbers.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Quiet Numbers"
        BUNDLE_LOADER: "$(TEST_HOST)"
  QuietNumbersUITests:
    type: bundle.ui-testing
    supportedDestinations: [iOS]
    sources: [UITests]
    dependencies:
      - target: QuietNumbers
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.quietproject.numbers.uitests
schemes:
  QuietNumbers:
    build:
      targets:
        QuietNumbers: all
    test:
      targets:
        - package: QuietNumbersCore/QuietNumbersCoreTests
        - QuietNumbersTests
        - QuietNumbersUITests
