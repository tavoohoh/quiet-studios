<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Quiet Studios</title>
  <meta name="description" content="Calm, honest apps and games for Apple devices.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2048%2048%22%3E%3Ccircle%20cx%3D%2221%22%20cy%3D%2222%22%20r%3D%2214%22%20fill%3D%22none%22%20stroke%3D%22%230E6B78%22%20stroke-width%3D%225%22/%3E%3Cline%20x1%3D%2231%22%20y1%3D%2238%22%20x2%3D%2243%22%20y2%3D%2238%22%20stroke%3D%22%23B9472F%22%20stroke-width%3D%225%22%20stroke-linecap%3D%22round%22/%3E%3C/svg%3E">
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f3f7f8;
      --surface: #ffffff;
      --ink: #16201f;
      --muted: #5e6f72;
      --accent: #0e6b78;
      --line: #e3eaec;
      --coral: #b9472f;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f1a1d;
        --surface: #172629;
        --ink: #e8f1f2;
        --muted: #8a9da0;
        --accent: #5bc2cf;
        --line: #263a3e;
        --coral: #ff9a85;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font: 17px/1.55 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Helvetica, Arial, sans-serif;
      -webkit-text-size-adjust: 100%;
    }
    main { max-width: 640px; margin: 0 auto; padding: 48px 20px 64px; }
    header { margin-bottom: 40px; }
    h1, h2, h3 { font-family: ui-rounded, -apple-system, BlinkMacSystemFont, sans-serif; line-height: 1.2; }
    h1 { font-size: 34px; margin: 0 0 8px; }
    h2 { font-size: 24px; margin: 48px 0 12px; }
    h3 { font-size: 18px; margin: 28px 0 6px; }
    p, li { color: var(--ink); }
    .muted { color: var(--muted); }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }
    nav { display: flex; flex-wrap: wrap; gap: 16px; font-size: 15px; }
    .lang { font-size: 15px; color: var(--muted); margin: 0 0 24px; }
    section + section { border-top: 1px solid var(--line); margin-top: 48px; }
    .card { background: var(--surface); border-radius: 18px; padding: 20px 22px; margin: 20px 0; }
    .card ul { margin: 0; padding-left: 20px; }
    .mark { display: block; margin-bottom: 16px; }
    footer { margin-top: 56px; font-size: 14px; color: var(--muted); }
  </style>
</head>
<body>
  <main>

    <header>
      <svg class="mark" width="48" height="48" viewBox="0 0 48 48" aria-hidden="true"><circle cx="21" cy="22" r="14" fill="none" stroke="var(--accent)" stroke-width="5"/><line x1="31" y1="38" x2="43" y2="38" stroke="var(--coral)" stroke-width="5" stroke-linecap="round"/></svg>
      <h1>Quiet Studios</h1>
      <p class="muted">Calm, honest apps and games. No ads, no purchases, no data collected.<br>
      Apps y juegos tranquilos y honestos. Sin anuncios, sin compras, sin recolectar datos.</p>
    </header>
    <div class="card">
      <p style="margin:0"><a href="quiet-numbers/"><strong>Quiet Numbers</strong></a><br>
      <span class="muted">Number puzzle · Puzzle de números</span></p>
    </div>
    <footer>
      <p>Quiet Studios</p>
    </footer>
  </main>
</body>
</html>
