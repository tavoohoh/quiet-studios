<style>body{margin:0}</style></head><body>
<div style="width:1280px;height:549px;position:relative;overflow:hidden;background:var(--bg, linear-gradient(180deg, #19BFCD, #0A8AA5));color:#FFFFFF;font-family:ui-rounded, 'SF Pro Rounded', Nunito, system-ui, sans-serif">

<div style="display:flex;flex-direction:column;gap:10px">
<span style="font-family:var(--sub-font, inherit);font-size:22px;font-weight:800;letter-spacing:0.04em;color:var(--eyebrow-color, rgba(255,255,255,0.85))">Quiet Sudoku</span>
