name: QuietSudoku
options:
  bundleIdPrefix: com.tavoohoh
  developmentLanguage: en
  deploymentTarget:
    iOS: "18.0"
packages:
  QuietSudokuCore:
    path: Packages/QuietSudokuCore
  QuietKit:
    path: ../QuietKit
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  QuietSudoku:
    type: application
    # iPhone and iPad; Apple silicon Macs run the iPad app ("Designed for iPad").
    supportedDestinations: [iOS]
    sources: [App]
    dependencies:
      - package: QuietSudokuCore
      - package: QuietKit
        product: QuietCore
      - package: QuietKit
        product: QuietUI
    info:
      path: App/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # Daily reminder: the friends refresh (DailyReminders.friendsTaskID).
        BGTaskSchedulerPermittedIdentifiers: [com.tavoohoh.quietsudoku.friends]
        UIBackgroundModes: [fetch]
        # Same background and lockup as SplashView, in light and dark.
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageName: SplashLockup
          UIImageRespectsSafeAreaInsets: false
    configFiles:
      Debug: Config/Base.xcconfig
      Release: Config/Base.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(QS_BUNDLE_ID)
        CODE_SIGN_ENTITLEMENTS: $(QS_ENTITLEMENTS)
        PRODUCT_NAME: Quiet Sudoku
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Quiet Sudoku
        INFOPLIST_KEY_NSGKFriendListUsageDescription: Show your Game Center friends on Quiet Sudoku leaderboards.
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.puzzle-games
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: AppIcon-Gold
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: NO
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
        SWIFT_EMIT_LOC_STRINGS: YES
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: YES
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
        CODE_SIGN_STYLE: Automatic
  QuietSudokuAppTests:
    type: bundle.unit-test
    supportedDestinations: [iOS]
    sources: [AppTests]
    dependencies:
      - target: QuietSudoku
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.tavoohoh.quietsudoku.tests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Quiet Sudoku.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Quiet Sudoku"
        BUNDLE_LOADER: "$(TEST_HOST)"
  QuietSudokuUITests:
    type: bundle.ui-testing
    supportedDestinations: [iOS]
    sources: [UITests]
    dependencies:
      - target: QuietSudoku
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.tavoohoh.quietsudoku.uitests
schemes:
  QuietSudoku:
    build:
      targets:
        QuietSudoku: all
    test:
      targets:
        - package: QuietSudokuCore/QuietSudokuCoreTests
        - QuietSudokuAppTests
        - QuietSudokuUITests
