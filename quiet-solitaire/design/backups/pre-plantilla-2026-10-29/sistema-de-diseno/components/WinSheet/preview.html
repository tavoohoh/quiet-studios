<!-- @dsCard group="Pantalla de juego" height=730 subtitle="Hoja de victoria con el multiplicador por tiempo" -->
<style>
  body { margin: 0; background: var(--background); color: var(--ink); font-family: var(--font-text); }
  .row { display: flex; gap: 14px; align-items: flex-start; flex-wrap: wrap; padding: 20px; }
  .lab { font: 700 12px/16px var(--font-text); color: var(--muted); letter-spacing: .04em; text-transform: uppercase; }
  .col { display: flex; flex-direction: column; gap: 8px; align-items: center; }
</style>
<div style="position:relative;width:390px;height:720px;overflow:hidden;background:var(--background)">
<div style="position:absolute;inset:0;background:#000000;opacity:0.18"></div>
<div style="position:absolute;left:0;right:0;bottom:0;padding:28px 20px 16px;border-radius:32px 32px 0 0;background:var(--surface);display:flex;flex-direction:column;gap:18px;box-shadow:var(--shadow-sheet)">
<div style="display:flex;flex-direction:column;align-items:center;gap:4px"><span style="font:600 17px/22px var(--font-text);color:var(--muted)">You won!</span><span style="font:800 56px/1 var(--font-rounded);font-variant-numeric:tabular-nums">2,830</span>
<span style="position:relative;margin-top:4px;padding:5px 12px;border-radius:9999px;font:800 15px/20px var(--font-text);color:var(--accent)"><span style="position:absolute;inset:0;border-radius:inherit;background:var(--accent);opacity:0.14"></span><span style="position:relative">New record!</span></span></div>
<div style="padding:0 16px;border-radius:20px;background:var(--background)"><div style="display:flex;justify-content:space-between;align-items:center;height:40px;border-bottom:1px solid var(--separator);"><span style="font:400 15px/20px var(--font-text);color:var(--muted)">Time</span><span style="font:700 15px/20px var(--font-rounded);font-variant-numeric:tabular-nums;color:var(--ink)">02:48</span></div><div style="display:flex;justify-content:space-between;align-items:center;height:40px;border-bottom:1px solid var(--separator);"><span style="font:400 15px/20px var(--font-text);color:var(--muted)">Moves</span><span style="font:700 15px/20px var(--font-rounded);font-variant-numeric:tabular-nums;color:var(--ink)">96</span></div><div style="display:flex;justify-content:space-between;align-items:center;height:40px;border-bottom:1px solid var(--separator);"><span style="font:400 15px/20px var(--font-text);color:var(--muted)">Game points</span><span style="font:700 15px/20px var(--font-rounded);font-variant-numeric:tabular-nums;color:var(--ink)">915</span></div><div style="display:flex;justify-content:space-between;align-items:center;height:40px;border-bottom:1px solid var(--separator);"><span style="font:400 15px/20px var(--font-text);color:var(--muted)">Few-moves bonus</span><span style="font:700 15px/20px var(--font-rounded);font-variant-numeric:tabular-nums;color:var(--ink)">+500</span></div><div style="display:flex;justify-content:space-between;align-items:center;height:40px;border-bottom:1px solid var(--separator);"><span style="font:400 15px/20px var(--font-text);color:var(--muted)">Time ×2.0</span><span style="font:700 15px/20px var(--font-rounded);font-variant-numeric:tabular-nums;color:var(--ink)">+1,415</span></div><div style="display:flex;justify-content:space-between;align-items:center;height:40px;"><span style="font:400 15px/20px var(--font-text);color:var(--muted)">Hints</span><span style="font:700 15px/20px var(--font-rounded);font-variant-numeric:tabular-nums;color:var(--ink)">0</span></div></div>
<div style="padding:12px;border-radius:20px;border:1.5px solid var(--surface2);display:flex;flex-direction:column;gap:8px"><span style="font:700 12px/16px var(--font-text);color:var(--muted);letter-spacing:.04em">ACHIEVEMENT UNLOCKED</span><span style="font:600 17px/22px var(--font-text)">One Pass</span><span style="font:400 15px/20px var(--font-text);color:var(--muted)">Classic deck</span></div>
<div style="display:flex;flex-direction:column;gap:10px"><span style="height:56px;border-radius:9999px;background:var(--primary);color:var(--on-primary);text-align:center;font:600 17px/56px var(--font-text)">New Game</span><span style="height:56px;border-radius:9999px;background:var(--surface2);color:var(--primary);text-align:center;font:600 17px/56px var(--font-text)">Home</span></div>
</div></div>
