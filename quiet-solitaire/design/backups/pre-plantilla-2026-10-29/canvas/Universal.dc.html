<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Universal 16:9 · header y búsqueda</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 1280px; height: 720px; position: relative; overflow: hidden; background: #0E6B78; color: #FFFFFF; font-family: ui-rounded, 'SF Pro Rounded', Nunito, system-ui, sans-serif"><div style="position: absolute; left: 0; right: 0; top: 70px; display: flex; flex-direction: column; align-items: center; gap: 10px">
  <span style="font-size: 22px; font-weight: 800; letter-spacing: 0.04em; color: rgba(255, 255, 255, 0.85)">Quiet Solitaire</span>
  <h1 style="margin: 0; font-size: 64px; line-height: 1; font-weight: 900; letter-spacing: -0.015em">Klondike. No ads. <span style="color: #FFC2B5">Breathe.</span></h1>
</div><div style="position: absolute; left: 462px; top: 230px; width: 356px; height: 490px; overflow: hidden">
  <div style="width: 356px; height: 752px; box-sizing: border-box; padding: 8px; border-radius: 52px; background: #0A1416; box-shadow: 0 30px 70px rgba(2, 30, 36, 0.35)">
    <div style="width: 340px; height: 736px; border-radius: 44px; overflow: hidden; position: relative">
      <div style="width: 390px; height: 844px; transform: scale(0.8718); transform-origin: 0 0"><dc-import name="Game" theme="teal-light" scene="mid" deck="quiet" back="theme" hint-size="390px,844px"></dc-import></div>
    </div>
  </div>
</div><div style="position: absolute; left: 230px; top: 380px; padding: 10px 18px; border-radius: 999px; background: #FFFFFF; color: #0E6B78; box-shadow: 0 14px 30px rgba(2, 30, 36, 0.3); font-size: 30px; font-weight: 900; white-space: nowrap">Tap to move</div><div style="position: absolute; left: 830px; top: 470px; padding: 10px 18px; border-radius: 999px; background: #B9472F; color: #FFFFFF; box-shadow: 0 14px 30px rgba(2, 30, 36, 0.3); font-size: 30px; font-weight: 900; white-space: nowrap">Every deal can be won</div><div style="display: {{safe}}; position: absolute; left: 160px; top: 90px; width: 960px; height: 540px; box-sizing: border-box; border: 2px dashed rgba(255,255,255,0.7); border-radius: 6px; pointer-events: none">
  <span style="position: absolute; left: 8px; top: 6px; font-family: -apple-system, system-ui, sans-serif; font-size: 12px; font-weight: 600; color: rgba(255,255,255,0.7)">Zona central (aprox.; ajustar con la plantilla de Apple)</span>
</div></div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"showSafe": {"editor": "boolean", "default": true, "label": "Mostrar zona central"}, "$preview": {"width": 1280, "height": 720}}'>

class Component extends DCLogic {
  renderVals() { return { safe: this.props.showSafe === false ? 'none' : 'block' }; }
}
</script>
</body>
</html>
