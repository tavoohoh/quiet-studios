        font: pixel ? "Silkscreen, ui-monospace, monospace" : "ui-rounded, 'SF Pro Rounded', Nunito, system-ui, sans-serif",

        rankSize: Math.round(w * (big ? 0.42 : (pixel ? 0.28 : (deck === 'illus' ? 0.36 : 0.34)))),

        smallSize: Math.round(w * (big ? 0.3 : 0.24)),
        suitBox: pixel ? '0 0 9 9' : '0 0 24 24',
        suitPath: pixel ? bitmapPath(PIXEL_SUITS[suitKey]) : SUITS[suitKey].path,
        slotPath: SUITS[suitKey].path,
        render: pixel ? 'crispEdges' : 'auto',
        pip: pip, pipX: Math.round((w - pip) / 2), pipY: panelY + Math.round((panelH - pip) / 2),
        panel: F.panel, panelX: panelX, panelY: panelY, panelW: panelW, panelH: panelH,
        portY: portY, portH: portH, portHint: panelW + 'px,' + portH + 'px',
        emblem: Math.round(Math.min(panelW, panelH) * 0.72), emblemPath: EMBLEMS[rank] || EMBLEMS.K,
        innerR: pixel ? 0 : Math.max(3, Math.round(r * 0.6)),
        inset: Math.round(w * 0.08), frameW: frameW,
        backLine: B.line, backMark: B.mark,
        mark: mark, markX: Math.round((w - mark) / 2), markY: Math.round((h - mark) / 2),
        barW: Math.max(1.5, Math.round(w * 0.035 * 10) / 10), barH: Math.round(mark * 0.36), barGap: Math.max(2, Math.round(mark * 0.14)),
        slotSuit: SUITS[glyph] ? true : false, slotKing: glyph === 'K', slotStock: glyph === 'stock',
        slotSize: Math.round(w * 0.42), glyphColor: T.glyph,
        cIndexX: Math.round(w * 0.03), cIndexY: Math.round(w * 0.05), cIndexW: Math.round(w * 0.22),
        cRankSize: Math.round(w * 0.23), cSuitSize: Math.round(w * 0.15),
        pips: pips, classicCourt: classic && face && court,
        frameX: frameX, frameY: frameY, frameWd: frameWd, frameHt: frameHt,
        halfW: frameWd - 2, halfH: halfH, halfHint: (frameWd - 2) + 'px,' + halfH + 'px'
      }
    };
  }
}
